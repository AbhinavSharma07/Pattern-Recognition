name: AST Pattern Auto-Refactorer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-and-refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-Agent Scanner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Scan and fix all Python files, applying valid refactors and generating reports
          python main.py fix . --report --apply

      - name: Check for modified files
        id: git-check
        run: |
          echo "modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'ast-refactor-bot[bot]'
          git config --global user.email 'bot@users.noreply.github.com'
          git commit -am "🤖 Auto-refactored structural anti-patterns"
          git push

      - name: Post Markdown Report to PR
        if: steps.git-check.outputs.modified == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## 🤖 AST Refactor Bot Report\n\nI have successfully scanned the codebase, detected structural code smells, generated fixes, validated them in the sandbox, and pushed the commits directly to this PR! Check the commit history to see the improvements."
            });